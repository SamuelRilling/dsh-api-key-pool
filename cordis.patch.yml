- insert:
    - id: api-key-pool
      name: dsh-api-key-pool
      inject: [llm, webServer, settings]
      config:
        pools:
          a:
            apiKeyEnv: A_API_KEY
            keys:
              - sk-your-first-key
            cooldownMs: 30000
          stepfun:
            apiKeyEnv: STEPFUN_API_KEY
            keys:
              - sk-your-second-key
            cooldownMs: 30000
        defaultCooldownMs: 30000